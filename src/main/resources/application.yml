spring:
  application:
    name: payledger
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:payledger}
    username: ${DB_USER:payledger}
    password: ${DB_PASSWORD:payledger}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: ${CACHE_TYPE:simple}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: payledger

info:
  app:
    name: PayLedger
    description: Payments and wallet API (milestones 1–5)
    version: 0.1.0-SNAPSHOT

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

payledger:
  security:
    jwt:
      secret: ${JWT_SECRET:payledger-dev-secret-change-me-please-32bytes-min}
      expiry-minutes: ${JWT_EXPIRY_MINUTES:120}
    demo-users:
      enabled: ${DEMO_USERS_ENABLED:true}
      admin-username: ${DEMO_ADMIN_USER:admin}
      admin-password: ${DEMO_ADMIN_PASSWORD:admin-change-me}
      merchant-username: ${DEMO_MERCHANT_USER:merchant}
      merchant-password: ${DEMO_MERCHANT_PASSWORD:merchant-change-me}
      merchant-name: Demo Merchant
      merchant-email: merchant@payledger.local
  webhooks:
    max-attempts: 5
    batch-size: 20
    base-backoff-seconds: 1
    poll-interval-ms: 2000
  kafka:
    webhook-topic: payledger.webhooks

logging:
  level:
    org.hibernate.SQL: warn
    com.payledger: info
